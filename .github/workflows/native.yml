name: Native builds
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      ORT_LOG: error
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Linux native audio development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --release --locked
      - name: Package and relocate helper
        run: node scripts/package-native.mjs '${{ matrix.platform }}'
      - name: Native real-model wiring smoke
        if: runner.os == 'Linux'
        run: |
          node scripts/smoke-native.mjs dist/aximo-voice-native-linux-x86_64 parakeet
          node scripts/smoke-native.mjs dist/aximo-voice-native-linux-x86_64 gigaam
      - uses: actions/upload-artifact@v7
        with:
          name: aximo-voice-${{ matrix.platform }}
          path: |
            dist/*
            native/Cargo.lock
          if-no-files-found: error
          retention-days: 14
