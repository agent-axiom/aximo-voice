name: Native builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            timeout: 45
          - runner: macos-15
            platform: macos-aarch64
            timeout: 45
          - runner: macos-15-intel
            platform: macos-x86_64
            timeout: 150
          - runner: windows-2022
            platform: windows-x86_64
            timeout: 45
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_BUILD_JOBS: '2'
      ORT_LOG: error
      AXIMO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Linux native audio development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
          cache-workspaces: 'native -> target'
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - name: Provision verified CPU ONNX Runtime
        run: node scripts/provision-onnx.mjs '${{ matrix.platform }}'
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo build --manifest-path native/Cargo.toml --release --locked
      - name: Package and relocate helper
        run: node scripts/package-native.mjs '${{ matrix.platform }}'
      - name: Test management with isolated fake Claude
        if: runner.os != 'Windows'
        run: AXIMO_REQUIRE_MANAGER_TESTS=1 node --test tests/manager.test.mjs
      - name: Package complete plugin and runtime preview kit
        if: runner.os != 'Windows'
        run: |
          node scripts/package-kit.mjs '${{ matrix.platform }}'
          env -u ORT_LIB_LOCATION -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH dist/kit/bin/aximo-voice doctor --package-only
      - name: Install exact tested Claude CLI for local marketplace smoke
        if: runner.os != 'Windows'
        run: npm install --prefix "$RUNNER_TEMP/claude-kit-tools" --no-save @anthropic-ai/claude-code@2.1.293
      - name: Verify real local marketplace in an isolated profile
        if: runner.os != 'Windows'
        run: node scripts/smoke-kit-marketplace.mjs dist/kit/bin/aximo-voice "$RUNNER_TEMP/claude-kit-tools/node_modules/.bin/claude"
      - name: Native real-model wiring smoke
        if: runner.os == 'Linux'
        run: |
          env -u ORT_LIB_LOCATION -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH node scripts/smoke-native.mjs dist/runtime/aximo-voice-native parakeet
          env -u ORT_LIB_LOCATION -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH node scripts/smoke-native.mjs dist/runtime/aximo-voice-native gigaam
      - uses: actions/upload-artifact@v7
        with:
          name: aximo-voice-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.build.json
            native/Cargo.lock
          if-no-files-found: error
          retention-days: 14
