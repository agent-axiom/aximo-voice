name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust_format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.94.1'
          components: rustfmt
      - run: cargo fmt --manifest-path native/Cargo.toml && git diff --exit-code -- native
  plugin:
    name: Plugin, lifecycle, documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test && npm run check
      - run: sh -n scripts/install-runtime.sh
      - name: Install exact tested Mods host
        run: npm install --prefix "$RUNNER_TEMP/claude-tools" --no-save @anthropic-ai/claude-code@2.1.293
      - name: Validate and test in real Mods host
        run: |
          "$RUNNER_TEMP/claude-tools/node_modules/.bin/claude" plugin validate .
          "$RUNNER_TEMP/claude-tools/node_modules/.bin/claude" plugin test .
  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.94.1'
          cache-workspaces: 'native -> target'
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file native/Cargo.lock

  windows_installer:
    name: Windows installer integrity
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exercise verified bundle install and rollback without network
        shell: powershell
        run: ./tests/install-runtime.Tests.ps1
